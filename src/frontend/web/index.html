<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crash Override VR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Crash Override: VR trials</h1>
  <p class="muted">Open this page in the headset browser. Enter the participant ID, start, then press Enter VR.</p>
  <form class="card" id="start">
    <label for="participant">Participant ID</label>
    <input id="participant" placeholder="p01" autocomplete="off" required>
    <div class="row"><button class="primary">Start VR session</button></div>
  </form>
</main>
<script>
  const input = document.getElementById("participant");
  try { input.value = localStorage.getItem("participant") || ""; } catch {}
  document.getElementById("start").addEventListener("submit", (event) => {
    event.preventDefault();
    const id = input.value.trim();
    try { localStorage.setItem("participant", id); } catch {}
    location.href = `xr.html?participant=${encodeURIComponent(id)}`;
  });
</script>
</body>
</html>
