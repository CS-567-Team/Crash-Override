<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Trial XR</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f27; color: #e8ebf0;
                 font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #hint { position: fixed; left: 16px; top: 16px; right: 16px; max-width: 560px; padding: 10px 14px;
            background: rgba(0, 0, 0, .55); border-radius: 8px; pointer-events: none; }
    canvas { display: block; }
    #enter { position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%); padding: 22px 56px;
             font: 600 30px system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; background: #2b5fc0;
             border: 3px solid #8fb3ff; border-radius: 16px; cursor: pointer; }
    #enter:disabled { background: #3a4150; border-color: #5d6675; color: #c8ccd4; font-size: 20px; cursor: default; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>

  <div id="hint">Loading…</div>
  <button id="enter">Enter VR</button>
