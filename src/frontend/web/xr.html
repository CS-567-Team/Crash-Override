<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Trial XR</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f27; color: #e8ebf0;
                 font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #hint { position: fixed; left: 16px; top: 16px; right: 16px; max-width: 560px; padding: 10px 14px;
            background: rgba(0, 0, 0, .55); border-radius: 8px; pointer-events: none; }
    canvas { display: block; }
    #enter { position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%); padding: 22px 56px;
             font: 600 30px system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; background: #2b5fc0;
             border: 3px solid #8fb3ff; border-radius: 16px; cursor: pointer; }
    #enter:disabled { background: #3a4150; border-color: #5d6675; color: #c8ccd4; font-size: 20px; cursor: default; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="hint">Loading…</div>
  <button id="enter">Enter VR</button>
  <script>
    // Runs before the 3D module so load failures show up in the headset instead of a silent "Loading…".
    (function () {
      var hint = document.getElementById("hint");
      var started = Date.now();
      function report(message) {
        hint.textContent = message;
        try {
          fetch("api/debug", { method: "POST", headers: { "Content-Type": "application/json" },
                               body: JSON.stringify({ event: "load_problem", message: message, userAgent: navigator.userAgent }) }).catch(function () {});
        } catch (e) {}
      }
      window.addEventListener("error", function (event) {
        if (event.target && event.target.src) report("Could not load " + event.target.src);
        else if (event.message) report("Error: " + event.message + " (" + event.filename + ":" + event.lineno + ")");
      }, true);
      document.getElementById("enter").addEventListener("click", function () {
        if (hint.textContent.indexOf("Loading") === 0) hint.textContent = "Still loading the 3D files, wait a moment and try again.";
      });
      // If the module has not replaced "Loading…" after 20 s, say so and check the big file directly.
      setTimeout(function check() {
        if (hint.textContent.indexOf("Loading") !== 0) return;
        var seconds = Math.round((Date.now() - started) / 1000);
        report("Still loading after " + seconds + " s. Checking three.module.js (the 1.3 MB 3D library)…");
        fetch("vendor/three.module.js", { cache: "no-store" }).then(function (r) {
          return r.text().then(function (text) {
            report("Still loading after " + seconds + " s. three.module.js: HTTP " + r.status + ", " +
                   (r.headers.get("Content-Type") || "no type") + ", " + text.length + " bytes (expected 1272972).");
          });
        }).catch(function (e) { report("Still loading after " + seconds + " s. three.module.js failed: " + e.message); });
      }, 20000);
    })();
  </script>
  <script type="module" src="xr.js"></script>
</body>
</html>
