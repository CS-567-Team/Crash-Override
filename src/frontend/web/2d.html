<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Trial 2D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1 id="title">Loading…</h1>
  <p class="muted">Review the agent output, then decide whether to accept the change into the codebase.</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="tab-panel" role="tabpanel" id="panel"></div>

  <div class="card" id="decision">
    <div id="questions"></div>
    <label>Decision</label>
    <div class="row" style="margin-top:0">
      <button class="choice" data-decision="accept" aria-pressed="false">Accept change</button>
      <button class="choice" data-decision="reject" aria-pressed="false">Reject change</button>
    </div>
    <div class="row"><button class="primary" id="submit" disabled>Submit decision</button></div>
    <div class="status" id="status" role="status"></div>
  </div>
</main>
<script type="module">
  import { QUESTIONS, params, fetchTrial, buildSections, InteractionLog, submitDecision } from "./common.js";

  const { trial, participant } = params();
  const log = new InteractionLog();
  const state = { decision: null, responses: {} };
  const status = document.getElementById("status");
  const submit = document.getElementById("submit");

  function renderSection(section) {
    const panel = document.getElementById("panel");
    panel.replaceChildren();
    if (section.kind === "diff") {
      const summary = document.createElement("p");
      summary.textContent = section.summary;
      const diff = document.createElement("div");
      diff.className = "diff";
      for (const line of section.text.split("\n")) {
        const span = document.createElement("span");
        span.textContent = line || " ";
        if (line.startsWith("@@")) span.className = "hunk";
        else if (line.startsWith("+") && !line.startsWith("+++")) span.className = "add";
        else if (line.startsWith("-") && !line.startsWith("---")) span.className = "del";
        diff.append(span);
      }
      panel.append(summary, diff);
    } else {
      const pre = document.createElement("pre");
      pre.textContent = section.text;
      panel.append(pre);
    }
  }

  function selectTab(sections, id) {
    document.querySelectorAll(".tab").forEach((tab) => tab.setAttribute("aria-selected", tab.dataset.id === id));
    renderSection(sections.find((s) => s.id === id));
    log.add("view", id);
  }

  function updateSubmit() {
    submit.disabled = !state.decision || QUESTIONS.some((q) => !state.responses[q.id]);
  }

  try {
    if (!trial || !participant) throw new Error("Open this page from the trial launcher.");
    const payload = await fetchTrial(trial);
    const sections = buildSections(payload);
    document.getElementById("title").textContent = payload.task.title;

    const tabs = document.getElementById("tabs");
    for (const section of sections) {
      const tab = document.createElement("button");
      tab.className = "tab";
      tab.role = "tab";
      tab.dataset.id = section.id;
      tab.textContent = section.title;
      tab.onclick = () => selectTab(sections, section.id);
      tabs.append(tab);
    }
    selectTab(sections, "task");
  } catch (error) {
    document.getElementById("title").textContent = "Could not load trial";
    status.textContent = error.message;
    submit.disabled = true;
  }

  const questions = document.getElementById("questions");
  for (const q of QUESTIONS) {
    const block = document.createElement("div");
    block.innerHTML = `<label></label><div class="likert"></div><div class="anchors"><span></span><span></span></div>`;
    block.querySelector("label").textContent = q.text;
    const [low, high] = block.querySelectorAll(".anchors span");
    low.textContent = `1 = ${q.low}`;
    high.textContent = `7 = ${q.high}`;
    const scale = block.querySelector(".likert");
    for (let value = 1; value <= 7; value++) {
      const button = document.createElement("button");
      button.textContent = value;
      button.setAttribute("aria-pressed", "false");
      button.onclick = () => {
        state.responses[q.id] = value;
        scale.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b === button));
        log.add("rate", `${q.id}=${value}`);
        updateSubmit();
      };
      scale.append(button);
    }
    questions.append(block);
  }

  document.querySelectorAll(".choice").forEach((button) => button.onclick = () => {
    state.decision = button.dataset.decision;
    document.querySelectorAll(".choice").forEach((b) => b.setAttribute("aria-pressed", b === button));
    log.add("choose", state.decision);
    updateSubmit();
  });

  submit.onclick = async () => {
    submit.disabled = true;
    try {
      await submitDecision({ cacheId: trial, participant, display: "2d", decision: state.decision,
                             responses: state.responses, log });
      status.textContent = "Decision recorded. Please let the researcher know you are done.";
      document.querySelectorAll("#decision button").forEach((b) => b.disabled = true);
    } catch (error) {
      status.textContent = error.message;
      updateSubmit();
    }
  };
</script>
</body>
</html>
